<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Executor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1e 100%);
            font-family: 'Courier New', monospace;
            color: #00ff88;
            height: 100vh;
            overflow: hidden;
        }
        
        .container {
            display: flex;
            height: 100vh;
            gap: 20px;
            padding: 20px;
        }
        
        .panel {
            background: rgba(15, 15, 30, 0.8);
            border: 2px solid #00ff88;
            border-radius: 8px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }
        
        .editor-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .console-panel {
            flex: 0.6;
            display: flex;
            flex-direction: column;
        }
        
        .panel h2 {
            color: #00ff88;
            margin-bottom: 15px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        textarea {
            flex: 1;
            background: #0a0a14;
            border: 1px solid #00ff88;
            color: #00ff88;
            padding: 12px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            resize: none;
            outline: none;
            line-height: 1.6;
        }
        
        textarea:focus {
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        button {
            flex: 1;
            padding: 12px;
            background: #00ff88;
            color: #0a0a14;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            transition: all 0.2s;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
        }
        
        button:hover {
            background: #00dd6b;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 136, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button.danger {
            background: #ff4444;
            color: white;
        }
        
        button.danger:hover {
            background: #ff2222;
        }
        
        button.secondary {
            background: #4a4a6a;
            flex: 0.5;
        }
        
        button.secondary:hover {
            background: #5a5a7a;
        }
        
        #console {
            flex: 1;
            background: #0a0a14;
            border: 1px solid #00ff88;
            padding: 12px;
            overflow-y: auto;
            font-size: 12px;
            line-height: 1.5;
            border-radius: 4px;
        }
        
        .console-line {
            margin: 4px 0;
            word-break: break-all;
        }
        
        .console-line.error {
            color: #ff6b6b;
        }
        
        .console-line.success {
            color: #51cf66;
        }
        
        .console-line.info {
            color: #74c0fc;
        }
        
        .console-line.warning {
            color: #ffd43b;
        }
        
        .console-line.command {
            color: #00ff88;
        }
        
        .status {
            margin-top: 15px;
            padding: 10px;
            background: rgba(0, 255, 136, 0.1);
            border-left: 3px solid #00ff88;
            border-radius: 4px;
            font-size: 12px;
        }
        
        .status.waiting {
            background: rgba(255, 212, 59, 0.1);
            border-left-color: #ffd43b;
            color: #ffd43b;
        }
        
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ff88;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }
        
        .status-dot.waiting {
            background: #ffd43b;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .input-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        input {
            flex: 1;
            padding: 10px;
            background: #0a0a14;
            border: 1px solid #00ff88;
            color: #00ff88;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            outline: none;
        }
        
        input:focus {
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal.show {
            display: flex;
        }
        
        .modal-content {
            background: #1a1a2e;
            border: 2px solid #00ff88;
            border-radius: 8px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
        }
        
        .modal-content h3 {
            color: #00ff88;
            margin-bottom: 15px;
        }
        
        .modal-content p {
            margin-bottom: 15px;
            color: #aaa;
            line-height: 1.6;
        }
        
        .modal-content code {
            background: #0a0a14;
            padding: 2px 6px;
            border-radius: 3px;
            color: #00ff88;
        }
        
        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .copy-btn {
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="panel editor-panel">
            <h2>⚡ Luau Script Editor</h2>
            <textarea id="scriptEditor" placeholder="-- Paste your Luau script here&#10;print('Hello from Roblox!')"
></textarea>
            <div class="button-group">
                <button onclick="copyLuaBackdoor()">Copy Backdoor</button>
                <button onclick="executeScript()">Execute</button>
                <button onclick="clearEditor()" class="danger">Clear</button>
            </div>
            <div class="status waiting" id="status">
                <span class="status-dot waiting"></span>
                <span id="statusText">Waiting for Roblox connection...</span>
            </div>
        </div>
        
        <div class="panel console-panel">
            <h2>📋 Console Output</h2>
            <div id="console"></div>
            <button onclick="clearConsole()" style="margin-top: 15px;">Clear Console</button>
        </div>
    </div>

    <!-- Modal for Lua Backdoor -->
    <div id="backdoorModal" class="modal">
        <div class="modal-content">
            <h3>🔗 Roblox Lua Backdoor</h3>
            <p>Copy this Lua script and inject it into Roblox using your exploit injector:</p>
            <textarea id="backdoorCode" readonly style="height: 300px; margin-bottom: 15px;"></textarea>
            <div class="modal-buttons">
                <button class="copy-btn" onclick="copyToClipboard()">Copy to Clipboard</button>
                <button class="copy-btn danger" onclick="closeBackdoorModal()">Close</button>
            </div>
        </div>
    </div>

    <script>
        // Global state
        let executionQueue = [];
        let connectedClients = new Map();
        let serverReady = false;

        // Lua Backdoor Script (embedded)
        const LUA_BACKDOOR = `-- Roblox WebSocket Backdoor
local function getPageURL()
    return window.location.origin
end

local WebSocketURL = getPageURL() .. "/ws"
local MAX_RETRIES = 5
local RETRY_DELAY = 2

local connected = false
local retryCount = 0

local function log(message, level)
    level = level or "INFO"
    local timestamp = os.date("%H:%M:%S")
    print(string.format("[%s] [%s] %s", timestamp, level, message))
end

local function executeLuau(script)
    log("Executing script...", "DEBUG")
    
    local success, result = pcall(function()
        return loadstring(script)()
    end)
    
    if success then
        log(string.format("Execution successful: %s", tostring(result)), "SUCCESS")
        return {success = true, output = tostring(result)}
    else
        log(string.format("Execution failed: %s", tostring(result)), "ERROR")
        return {success = false, error = tostring(result)}
    end
end

local function webSocketListener()
    log("Starting backdoor listener...", "INFO")
    
    while true do
        local success, message = pcall(function()
            -- Wait for messages from HTML executor
            -- This uses a polling mechanism since Roblox doesn't have native WebSocket
            wait(0.5)
        end)
        
        if not success then
            log("Listener error: " .. tostring(message), "ERROR")
            wait(RETRY_DELAY)
        end
    end

spawn(function()
    webSocketListener()
end)

log("Backdoor loaded and active", "SUCCESS")

while true do
    wait(30)
end`;

        function log(message, type = 'info') {
            const console = document.getElementById('console');
            const line = document.createElement('div');
            line.className = `console-line ${type}`;
            line.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            console.appendChild(line);
            console.scrollTop = console.scrollHeight;
        }

        function updateStatus(message, isReady = false) {
            const status = document.getElementById('status');
            const statusText = document.getElementById('statusText');
            const statusDot = status.querySelector('.status-dot');
            
            statusText.textContent = message;
            
            if (isReady) {
                status.classList.remove('waiting');
                statusDot.classList.remove('waiting');
                serverReady = true;
            }
        }

        function copyLuaBackdoor() {
            const backdoorCode = document.getElementById('backdoorCode');
            backdoorCode.value = LUA_BACKDOOR;
            
            const modal = document.getElementById('backdoorModal');
            modal.classList.add('show');
            
            log('Backdoor code loaded', 'info');
        }

        function closeBackdoorModal() {
            const modal = document.getElementById('backdoorModal');
            modal.classList.remove('show');
        }

        function copyToClipboard() {
            const backdoorCode = document.getElementById('backdoorCode');
            backdoorCode.select();
            document.execCommand('copy');
            log('Backdoor code copied to clipboard', 'success');
        }

        function executeScript() {
            const script = document.getElementById('scriptEditor').value.trim();
            
            if (!script) {
                log('Script is empty', 'warning');
                return;
            }
            
            if (!serverReady) {
                log('Waiting for Roblox connection...', 'warning');
                executionQueue.push(script);
                return;
            }
            
            // Store script for execution when backdoor connects
            const execId = 'exec_' + Date.now();
            const payload = {
                id: execId,
                type: 'execute',
                script: script,
                timestamp: new Date().toISOString()
            };
            
            // Simulate storage/broadcast mechanism
            sessionStorage.setItem('roblox_pending_' + execId, JSON.stringify(payload));
            
            log('Script queued for execution', 'command');
            log('Code: ' + script.substring(0, 50) + '...', 'info');
            
            // Monitor for result
            monitorExecution(execId);
        }

        function monitorExecution(execId) {
            const checkInterval = setInterval(() => {
                const result = sessionStorage.getItem('roblox_result_' + execId);
                
                if (result) {
                    const data = JSON.parse(result);
                    if (data.success) {
                        log('Execution result: ' + data.output, 'success');
                    } else {
                        log('Execution error: ' + data.error, 'error');
                    }
                    sessionStorage.removeItem('roblox_result_' + execId);
                    clearInterval(checkInterval);
                }
            }, 500);
            
            // Timeout after 30 seconds
            setTimeout(() => clearInterval(checkInterval), 30000);
        }

        function clearEditor() {
            document.getElementById('scriptEditor').value = '';
            log('Editor cleared', 'info');
        }

        function clearConsole() {
            document.getElementById('console').innerHTML = '';
            log('Console cleared', 'info');
        }

        // Simulation of Roblox connection (in real scenario, Lua backdoor would trigger this)
        window.addEventListener('load', () => {
            log('Roblox Executor initialized', 'info');
            log('1. Copy the Lua backdoor code', 'command');
            log('2. Inject into Roblox using your exploit', 'command');
            log('3. Write scripts in the editor above', 'command');
            log('4. Click Execute to run on Roblox', 'command');
            
            // Simulate connection after delay (for demo purposes)
            setTimeout(() => {
                updateStatus('Ready - Awaiting Roblox connection', false);
                log('Executor online', 'info');
            }, 1000);
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                executeScript();
            }
            if (e.ctrlKey && e.shiftKey && e.key === 'L') {
                copyLuaBackdoor();
            }
        });

        // Modal close on escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeBackdoorModal();
            }
        });

        // Storage event listener for cross-tab communication
        window.addEventListener('storage', (e) => {
            if (e.key && e.key.startsWith('roblox_')) {
                log('Roblox event detected: ' + e.key, 'info');
            }
        });
    </script>
</body>
</html>
